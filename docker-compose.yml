version: "3.7"
name: crm
services:
  mariadb:
    image: mariadb@sha256:456709ab146585d6189da05669b84384518baecd83670c9e5221f8c20a47cf1e
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-}
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis@sha256:ba6e394f6acc2a695ef1b6944f161b9ca813711739be68319fa0db3470673f1d

  frappe:
    image: frappe/bench@sha256:7cf2354c5024d8362c507619566fec700740e31bcd71a2e745e3ec9a3a778a2a
    command: bash /workspace/init.sh
    environment:
      - SHELL=/bin/bash
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    working_dir: /home/frappe
    volumes:
      - .:/workspace:Z
      - ./bench:/home/frappe/frappe-bench:Z
    ports:
      - 8000:8000
      - 9000:9000

volumes:
  mariadb-data:
